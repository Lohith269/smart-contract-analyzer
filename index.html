<!DOCTYPE html>
<html>
<head>
    <title>Smart Contract Analyzer</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .box {
            background: #1e293b;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
        }

        button {
            padding: 10px 20px;
            background: #22c55e;
            border: none;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }

        .result {
            margin-top: 30px;
            text-align: center;
        }

        .safe {
            color: #22c55e;
            font-weight: bold;
        }

        .danger {
            color: #ef4444;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Smart Contract Vulnerability Analyzer</h1>

    <div class="box">
        <input type="file" id="file">
        <br>
        <button onclick="analyzeContract()">Analyze</button>
    </div>

    <div class="result" id="result"></div>

        <script>
async function analyzeContract() {

    const fileInput = document.getElementById("file");

    if (!fileInput.files.length) {
        alert("Select file first");
        return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    try {
        const response = await fetch("http://127.0.0.1:5000/analyze", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        console.log("Backend response:", data); // DEBUG

        // 🔥 Handle backend error safely
        if (data.error) {
            alert("Backend error: " + data.error);
            return;
        }

        let output = `<h2>Analysis Result</h2>`;

        // ===== REENTRANCY =====
        if (data.reentrancy) {
            output += `<p><strong>Reentrancy:</strong> ${data.reentrancy.label}</p>`;

            if (data.reentrancy.reasons && data.reentrancy.reasons.length > 0) {
                output += "<ul>";
                data.reentrancy.reasons.forEach(r => {
                    output += `<li>${r}</li>`;
                });
                output += "</ul>";
            }
        }

        // ===== OVERFLOW =====
        if (data.overflow) {
            output += `<p><strong>Overflow:</strong> ${data.overflow.label}</p>`;

            if (data.overflow.reasons && data.overflow.reasons.length > 0) {
                output += "<ul>";
                data.overflow.reasons.forEach(r => {
                    output += `<li>${r}</li>`;
                });
                output += "</ul>";
            }
        }

        document.getElementById("result").innerHTML = output;

    } catch (error) {
        console.error("FULL ERROR:", error);
        alert("Error connecting to backend");
    }
}
</script>

</body>
</html>
